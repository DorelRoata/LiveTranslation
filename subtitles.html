<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projector Screen - Live Subtitles</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      --subtitle-font-size: clamp(1.4rem, min(3.5vw, 6vh), 4.5rem);
      --subtitle-line-height: 1.15;
      --subtitle-line-gap: 0.25rem;
      --subtitle-bottom-safe: clamp(1rem, 3vh, 2.5rem);
      background-color: #000000;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0 clamp(0.75rem, 3vw, 3rem);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }
    body[data-subtitle-size="sm"] {
      --subtitle-font-size: clamp(1.25rem, min(3vw, 5.3vh), 3.9rem);
    }
    body[data-subtitle-size="lg"] {
      --subtitle-font-size: clamp(1.5rem, min(4vw, 6.8vh), 5.1rem);
    }
    .status-dot {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #f59e0b; /* Yellow/Amber by default (Connecting) */
      z-index: 10;
      transition: background-color 0.3s ease, box-shadow 0.3s ease, opacity 0.4s ease, transform 0.4s ease;
      box-shadow: 0 0 8px #f59e0b;
    }
    .status-dot.chrome-hidden {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      width: 100%;
      box-sizing: border-box;
      gap: 0.75rem;
      justify-content: center;
      transition: all 0.5s ease;
    }
    .section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0.5rem 2.5rem;
      box-sizing: border-box;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.5s ease;
      opacity: 1;
    }
    .section.hidden {
      display: none !important;
      opacity: 0;
    }
    body.single-language-layout .container {
      justify-content: flex-start;
    }
    body.single-language-layout .section {
      flex: 0 0 50%;
    }
    body.single-language-layout:has(#message-panel:not([hidden])) .section {
      flex: 0 0 42%;
    }
    .text {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      position: relative;
      width: 100%;
      height: auto;
      min-height: 0;
      max-height: none;
      box-sizing: border-box;
      overflow: hidden;
      color: #ffffff;
      padding: 0 10% var(--subtitle-bottom-safe);
    }
    .sub-line,
    .sub-line-active {
      font-size: var(--subtitle-font-size);
      font-weight: 800;
      color: #ffffff;
      line-height: var(--subtitle-line-height);
      margin-bottom: var(--subtitle-line-gap);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
    }
    .sub-line-leaving {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      margin: 0;
    }
    /* Individual word fade-in for smooth typing effect */
    .sub-word {
      display: inline;
      opacity: 0;
      animation: wordFadeIn 150ms ease forwards;
    }
    @keyframes wordFadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Floating Control Bar Styles */
    .control-bar {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.5rem;
      max-width: calc(100vw - 3rem);
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(18, 18, 29, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.5rem 1.5rem;
      border-radius: 30px;
      z-index: 100;
      align-items: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .control-bar.hidden {
      opacity: 0;
      transform: translate(-50%, -20px);
      pointer-events: none;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .control-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 700;
    }
    .control-sublabel {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 700;
    }
    .control-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #aab6bd;
      padding: 0.35rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.3s ease;
      font-family: inherit;
      outline: none;
    }
    .control-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .control-btn.active {
      background: #f0785e;
      border-color: rgba(240, 120, 94, 0.5);
      color: #182025;
      box-shadow: 0 0 12px rgba(240, 120, 94, 0.3);
    }
    .control-btn.audio-active {
      background: #10b981;
      border-color: rgba(16, 185, 129, 0.5);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }
    .control-btn.compact {
      min-width: 2rem;
      padding: 0.35rem 0.6rem;
    }

    /* Corner QR so the congregation can join without covering the subtitles */
    .qr-float {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      padding: 0.5rem 0.5rem 0.4rem;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    }
    .qr-float.hidden {
      display: none !important;
    }
    .qr-float canvas {
      display: block;
      width: 148px;
      height: 148px;
    }
    .qr-float-caption {
      margin: 0;
      color: #182025;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.1;
    }

    /* OBS Broadcast Mode */
    body.obs-mode {
      background-color: transparent !important;
    }
    body.obs-mode .status-dot,
    body.obs-mode .control-bar,
    body.obs-mode .qr-float {
      display: none !important;
    }

    /* ---- Message notes: verse pop-ups, summary, points, verses read ---- */
    .section {
      position: relative;
    }
    .message-panel {
      --mp-scale: 1;
      --scripture: #e8bd62;
      --scripture-soft: rgba(232, 189, 98, 0.32);
      flex: 1 1 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      align-content: start;
      gap: clamp(0.75rem, 1.8vh, 1.35rem);
      padding: clamp(0.9rem, 2.4vh, 2rem) clamp(0.5rem, 5vw, 6rem) max(var(--subtitle-bottom-safe), env(safe-area-inset-bottom));
      box-sizing: border-box;
      overflow: hidden;
      font-size: calc(min(1.42vw, 2.7vh) * var(--mp-scale));
      color: #d6dee2;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.11), transparent) top / 100% 1px no-repeat;
    }
    .message-panel[hidden],
    .message-panel [hidden],
    .verse-float[hidden],
    .verse-float [hidden],
    .recap-overlay[hidden] {
      display: none !important;
    }
    .message-panel[data-columns="notes"],
    .message-panel[data-columns="scripture"] {
      grid-template-columns: minmax(0, 1fr);
    }
    .message-panel[data-columns="both"] .mp-scripture {
      padding-top: 0.7em;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .message-panel[data-columns="scripture"] {
      font-size: calc(min(1.85vw, 3.35vh) * var(--mp-scale));
      justify-items: center;
      align-content: center;
    }
    .message-panel[data-columns="scripture"] .mp-scripture {
      width: min(100%, 62em);
    }
    body.qr-on .message-panel {
      padding-right: calc(148px + 3rem);
    }
    .mp-notes,
    .mp-scripture {
      min-width: 0;
    }
    .mp-title {
      margin: 0 0 0.25em;
      font-size: 1.32em;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: 0.005em;
      color: #ffffff;
    }
    .mp-summary {
      margin: 0 0 0.6em;
      max-width: none;
      font-size: 0.98em;
      font-weight: 400;
      line-height: 1.4;
      color: #b4c1c8;
    }
    .mp-points {
      list-style: none;
      counter-reset: point;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 22em), 1fr));
      gap: 0.36em 1.5em;
      margin: 0;
      padding: 0;
    }
    .mp-points li {
      counter-increment: point;
      display: grid;
      grid-template-columns: 1.55em minmax(0, 1fr);
      gap: 0.6em;
      align-items: start;
      font-size: 1.02em;
      font-weight: 600;
      line-height: 1.3;
      color: #eef2f4;
    }
    .mp-points li::before {
      content: counter(point);
      display: grid;
      place-items: center;
      width: 1.55em;
      height: 1.55em;
      margin-top: -0.06em;
      border-radius: 50%;
      font-size: 0.74em;
      font-weight: 800;
      line-height: 1;
      color: #1a1f23;
      background: #f0785e;
      box-shadow: 0 0 14px rgba(240, 120, 94, 0.28);
    }
    .mp-points li.mp-new {
      animation: mpRise 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .mp-verse {
      position: relative;
      padding: 0.15em 0 0 1em;
      border-left: 3px solid var(--scripture);
    }
    .mp-verse-head {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.25em 0.75em;
    }
    .mp-verse-ref {
      font-size: 1.38em;
      font-weight: 800;
      line-height: 1.15;
      color: var(--scripture);
    }
    .mp-verse-version {
      font-size: 0.64em;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #87959d;
    }
    .mp-verse-text,
    .vf-text {
      font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
      color: #f7f2e7;
    }
    .mp-verse-text {
      margin: 0.35em 0 0;
      font-size: 1.28em;
      line-height: 1.44;
    }
    .verse-num {
      margin-right: 0.18em;
      font-family: 'Outfit', sans-serif;
      font-size: 0.58em;
      font-weight: 800;
      color: var(--scripture);
    }
    .verse-timer {
      display: block;
      height: 2px;
      margin-top: 0.85em;
      overflow: hidden;
      border-radius: 2px;
      background: rgba(232, 189, 98, 0.16);
    }
    .verse-timer > span {
      display: block;
      height: 100%;
      background: var(--scripture);
      transform-origin: left center;
    }
    @keyframes verseTimer {
      to { transform: scaleX(0); }
    }
    .mp-verse-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4em 0.45em;
      margin: 0.75em 0 0;
      padding: 0;
    }
    .mp-verse[hidden] + .mp-verse-list {
      margin-top: 0;
    }
    .mp-verse-list li {
      padding: 0.26em 0.76em 0.3em;
      border: 1px solid var(--scripture-soft);
      border-radius: 999px;
      font-size: 0.86em;
      font-weight: 600;
      line-height: 1.2;
      color: #cfd8dc;
      background: rgba(232, 189, 98, 0.05);
    }
    .mp-verse-list li.current {
      color: #1a1f23;
      background: var(--scripture);
      border-color: var(--scripture);
    }

    /* Two languages: the verse sits in the space above each language's lines. */
    .verse-float {
      --scripture: #e8bd62;
      position: absolute;
      top: clamp(0.35rem, 1.3vh, 1rem);
      left: 50%;
      z-index: 5;
      width: min(82%, 74rem);
      box-sizing: border-box;
      transform: translateX(-50%);
      padding: 0.5em 1.05em 0.55em;
      border: 1px solid rgba(232, 189, 98, 0.34);
      border-radius: 12px;
      background: rgba(15, 19, 23, 0.9);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      font-size: min(1.48vw, 2.65vh);
      color: #f7f2e7;
    }
    .vf-ref {
      font-weight: 800;
      color: var(--scripture);
      white-space: nowrap;
    }
    .vf-text {
      display: -webkit-box;
      margin: 0.18em 0 0;
      overflow: hidden;
      line-height: 1.34;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .verse-float .verse-timer {
      margin-top: 0.45em;
    }

    /* Recap: the whole message over the subtitles, when the operator asks. */
    .recap-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 4vh 4vw;
      background: rgba(0, 0, 0, 0.74);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .recap-card {
      --recap-scale: 1;
      --scripture: #e8bd62;
      --scripture-soft: rgba(232, 189, 98, 0.32);
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 3.5vw;
      width: min(92vw, 120rem);
      max-height: 88vh;
      box-sizing: border-box;
      overflow: hidden;
      padding: 4.5vh 3.6vw;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 22px;
      background: linear-gradient(180deg, #161c21 0%, #0e1317 100%);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
      font-size: calc(min(1.55vw, 2.8vh) * var(--recap-scale));
      color: #d6dee2;
    }
    .recap-column + .recap-column {
      padding-left: 3.5vw;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
    }
    .recap-card .mp-title {
      font-size: 1.6em;
    }

    .mp-fresh {
      animation: mpFade 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .verse-float.mp-fresh {
      animation: floatIn 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes mpFade {
      from { opacity: 0; transform: translateY(0.35em); }
      to { opacity: 1; transform: none; }
    }
    @keyframes mpRise {
      from { opacity: 0; transform: translateY(0.5em); }
      to { opacity: 1; transform: none; }
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translate(-50%, -0.5em); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* The spoken language: the same look as the subtitles, newest line at the
       bottom, older lines scrolling off the top. */
    #sec-src[hidden],
    .control-btn[hidden] {
      display: none !important;
    }
    .src-window {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      max-height: calc(var(--subtitle-font-size) * var(--subtitle-line-height) * var(--src-lines, 3));
      overflow: hidden;
      /* Hides the edge of the line that just scrolled off the top. */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 0.3em);
      mask-image: linear-gradient(to bottom, transparent 0, #000 0.3em);
    }
    .src-lines {
      margin: 0;
      font-size: var(--subtitle-font-size);
      font-weight: 800;
      line-height: var(--subtitle-line-height);
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
    }

    /* Following a reading: the verse being read, then the next one, dimmed. */
    .verse-next {
      opacity: 0.42;
    }
    .mp-advance {
      animation: mpAdvance 420ms ease both;
    }
    @keyframes mpAdvance {
      from { opacity: 0.35; }
      to { opacity: 1; }
    }
    /* The verse also in the spoken language's Bible, under the screen's own. */
    .mp-verse-spoken {
      margin-top: 0.65em;
      padding-top: 0.55em;
      border-top: 1px solid rgba(232, 189, 98, 0.18);
    }
    .mp-verse-spoken .mp-verse-head {
      font-size: 1em;
    }
    .mp-verse-spoken .mp-verse-ref {
      font-size: 1.38em;
      color: #d9b46a;
    }
    .mp-verse-spoken .mp-verse-text {
      font-size: 1.28em;
      color: #f7f2e7;
    }

    body.obs-mode .message-panel,
    body.obs-mode .verse-float,
    body.obs-mode .recap-overlay {
      display: none !important;
    }

    .control-btn:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 2px;
    }

    @media (max-width: 700px) {
      body {
        width: 100%;
        min-height: 100dvh;
        height: 100dvh;
        overflow: hidden;
        padding: 0 max(0.75rem, env(safe-area-inset-right)) 0 max(0.75rem, env(safe-area-inset-left));
      }
      .control-bar {
        position: fixed;
        top: max(0.75rem, env(safe-area-inset-top));
        width: calc(100% - 1.5rem - env(safe-area-inset-left) - env(safe-area-inset-right));
        max-width: 34rem;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.6rem;
        border-radius: 18px;
      }
      .status-dot {
        top: max(0.9rem, env(safe-area-inset-top));
        right: max(0.9rem, env(safe-area-inset-right));
      }
      .control-group {
        flex-wrap: wrap;
        justify-content: center;
      }
      .control-bar > div[style*="width: 1px"] {
        display: none;
      }
      .container {
        min-height: 100%;
        padding-top: 0;
        gap: 1rem;
      }
      .section {
        padding: 0.5rem 1rem;
      }
      .text {
        padding: 0 0 max(1rem, env(safe-area-inset-bottom));
      }
      .qr-float canvas {
        width: 112px;
        height: 112px;
      }
      .message-panel,
      .message-panel[data-columns="scripture"] {
        grid-template-columns: minmax(0, 1fr);
        gap: 0.9rem;
        padding: 0.8rem 0.25rem max(1rem, env(safe-area-inset-bottom));
        overflow-y: auto;
        font-size: calc(clamp(0.82rem, 3.7vw, 1.05rem) * var(--mp-scale));
      }
      .message-panel .mp-scripture {
        order: -1;
      }
      body.qr-on .message-panel {
        padding-right: 0.25rem;
      }
      .verse-float {
        width: calc(100% - 0.5rem);
        font-size: clamp(0.78rem, 3.4vw, 0.95rem);
      }
      .recap-card {
        grid-auto-flow: row;
        grid-auto-columns: auto;
        font-size: calc(clamp(0.85rem, 3.8vw, 1.05rem) * var(--recap-scale));
        overflow-y: auto;
      }
      .recap-column + .recap-column {
        padding-left: 0;
        padding-top: 1.2rem;
        border-left: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
    }

    @media (max-height: 650px) {
      body {
        --subtitle-font-size: clamp(1.2rem, 3vw, 2.1rem);
        --subtitle-bottom-safe: max(0.75rem, env(safe-area-inset-bottom));
        padding: 0 max(0.75rem, env(safe-area-inset-right)) 0 max(0.75rem, env(safe-area-inset-left));
      }
      body[data-subtitle-size="sm"] {
        --subtitle-font-size: clamp(1.05rem, 2.6vw, 1.8rem);
      }
      body[data-subtitle-size="lg"] {
        --subtitle-font-size: clamp(1.3rem, 3.4vw, 2.4rem);
      }
      .container {
        gap: 0.5rem;
      }
      .section {
        padding: 0.5rem 0.75rem;
      }
      .text {
        height: auto;
        padding: 0 2% var(--subtitle-bottom-safe);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body data-subtitle-size="md">
  <div class="status-dot" id="status-indicator" role="status" aria-label="Connecting to host" title="Connecting to Host..."></div>

  <!-- Floating Navigation Controls -->
  <div class="control-bar" id="control-bar">
    <div class="control-group">
      <span class="control-label">Layout:</span>
      <button class="control-btn active" id="btn-view-both" aria-pressed="true">Both</button>
      <button class="control-btn" id="btn-view-lang1" aria-pressed="false">Language 1</button>
      <button class="control-btn" id="btn-view-lang2" aria-pressed="false" style="display: none;">Language 2</button>
      <button class="control-btn" id="btn-view-src" type="button" aria-pressed="false" title="The preacher's own language, as Google hears it." hidden>Original</button>
    </div>
    <div style="width: 1px; height: 1.5rem; background: rgba(255,255,255,0.1);"></div>
    <div class="control-group" aria-label="Subtitle display settings">
      <span class="control-label">Display:</span>
      <span class="control-sublabel">Lines</span>
      <button class="control-btn compact subtitle-lines-btn" type="button" data-lines="2" aria-label="Show two subtitle lines" aria-pressed="false">2</button>
      <button class="control-btn compact subtitle-lines-btn active" type="button" data-lines="3" aria-label="Show three subtitle lines" aria-pressed="true">3</button>
      <span class="control-sublabel">Text</span>
      <button class="control-btn compact subtitle-size-btn" type="button" data-size="sm" aria-label="Small subtitle text" aria-pressed="false">S</button>
      <button class="control-btn compact subtitle-size-btn active" type="button" data-size="md" aria-label="Medium subtitle text" aria-pressed="true">M</button>
      <button class="control-btn compact subtitle-size-btn" type="button" data-size="lg" aria-label="Large subtitle text" aria-pressed="false">L</button>
    </div>
    <div style="width: 1px; height: 1.5rem; background: rgba(255,255,255,0.1);"></div>
    <div class="control-group">
      <span class="control-label">Audio:</span>
      <button class="control-btn" id="btn-audio-toggle" aria-pressed="false">Disabled</button>
    </div>
    <div style="width: 1px; height: 1.5rem; background: rgba(255,255,255,0.1);"></div>
    <div class="control-group">
      <span class="control-label">Screen:</span>
      <button class="control-btn" id="btn-wake-lock" aria-pressed="false">Keep Awake</button>
    </div>
    <div style="width: 1px; height: 1.5rem; background: rgba(255,255,255,0.1);"></div>
    <div class="control-group">
      <span class="control-label">Share:</span>
      <button class="control-btn" id="btn-qr-toggle" type="button" aria-pressed="false">QR Off</button>
    </div>
    <div style="width: 1px; height: 1.5rem; background: rgba(255,255,255,0.1);"></div>
    <div class="control-group">
      <span class="control-label">Notes:</span>
      <button class="control-btn active" id="btn-summary-toggle" type="button" aria-pressed="true">Summary On</button>
      <button class="control-btn active" id="btn-verses-toggle" type="button" aria-pressed="true">Bible On</button>
    </div>
    <div style="width: 1px; height: 1.5rem; background: rgba(255,255,255,0.1);"></div>
    <span style="font-size: 0.65rem; color: rgba(255,255,255,0.3); font-weight: 500; font-family: monospace;">v1.5.2</span>
  </div>

  <div class="container" id="subtitles-container">
    <div class="section" id="sec-lang1">
      <div class="text" id="sub-lang1">-</div>
      <aside class="verse-float" id="verse-float-lang1" hidden>
        <span class="vf-ref" data-part="ref" dir="auto"></span>
        <p class="vf-text" data-part="text" dir="auto"></p>
        <span class="verse-timer"><span data-part="timer"></span></span>
      </aside>
    </div>
    <div class="section" id="sec-lang2" style="display: none;">
      <div class="text" id="sub-lang2">-</div>
      <aside class="verse-float" id="verse-float-lang2" hidden>
        <span class="vf-ref" data-part="ref" dir="auto"></span>
        <p class="vf-text" data-part="text" dir="auto"></p>
        <span class="verse-timer"><span data-part="timer"></span></span>
      </aside>
    </div>
    <div class="section" id="sec-src" hidden>
      <div class="text">
        <div class="src-window"><p class="src-lines" id="sub-src" dir="auto"></p></div>
      </div>
    </div>
    <section class="message-panel" id="message-panel" aria-live="polite" hidden>
      <div class="mp-notes" data-part="notes" dir="auto">
        <h2 class="mp-title" data-part="title"></h2>
        <p class="mp-summary" data-part="summary"></p>
        <ol class="mp-points" data-part="points"></ol>
      </div>
      <div class="mp-scripture" data-part="scripture">
        <article class="mp-verse" data-part="verse" hidden>
          <div class="mp-verse-head">
            <span class="mp-verse-ref" data-part="verse-ref" dir="auto"></span>
            <span class="mp-verse-version" data-part="verse-version"></span>
          </div>
          <p class="mp-verse-text" data-part="verse-text" dir="auto"></p>
          <div class="mp-verse-spoken" data-part="spoken" hidden>
            <div class="mp-verse-head">
              <span class="mp-verse-ref" data-part="spoken-ref" dir="auto"></span>
              <span class="mp-verse-version" data-part="spoken-version"></span>
            </div>
            <p class="mp-verse-text" data-part="spoken-text" dir="auto"></p>
          </div>
          <span class="verse-timer" data-part="verse-timer-track"><span data-part="verse-timer"></span></span>
        </article>
        <ul class="mp-verse-list" data-part="list"></ul>
      </div>
    </section>
  </div>

  <div class="recap-overlay" id="recap-overlay" hidden>
    <div class="recap-card" data-part="recap"></div>
  </div>

  <aside class="qr-float hidden" id="qr-float" aria-hidden="true">
    <canvas id="qr-canvas-projector" width="168" height="168" aria-label="QR code for the phone subtitle link"></canvas>
    <p class="qr-float-caption">Scan for subtitles</p>
  </aside>

  <script type="module" src="/src/subtitles.js"></script>
</body>
</html>
